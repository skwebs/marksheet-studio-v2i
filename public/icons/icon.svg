
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Marksheet -->
  <path d="M130 110 H350 L405 165 V420 Q405 440 385 440 H130 Q110 440 110 420 V130 Q110 110 130 110Z"
        fill="url(#paper)"/>
  <path d="M350 110 V145 Q350 165 370 165 H405"
        fill="#bfdbfe"/>

  <!-- Student profile -->
  <circle cx="165" cy="190" r="23" fill="#1e40af"/>
  <path d="M125 250 Q125 215 165 215 Q205 215 205 250Z"
        fill="#1e40af"/>

  <!-- Student information lines -->
  <rect x="225" y="170" width="145" height="15" rx="7" fill="#1e40af"/>
  <rect x="225" y="200" width="135" height="11" rx="5" fill="#93c5fd"/>
  <rect x="225" y="220" width="100" height="11" rx="5" fill="#93c5fd"/>

  <!-- Marks table -->
  <rect x="125" y="270" width="250" height="112" rx="9"
        fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
  <path d="M125 279 Q125 270 134 270 H366 Q375 270 375 279 V295 H125Z"
        fill="#3b82f6"/>

  <path d="M125 312 H375 M125 335 H375 M125 358 H375"
        stroke="#bfdbfe" stroke-width="2"/>
  <path d="M270 270 V382" stroke="#93c5fd" stroke-width="2"/>

  <g fill="#1e40af">
    <rect x="140" y="301" width="75" height="7" rx="3"/>
    <rect x="140" y="324" width="65" height="7" rx="3"/>
    <rect x="140" y="347" width="85" height="7" rx="3"/>
    <rect x="140" y="370" width="70" height="7" rx="3"/>
  </g>

  <g font-family="Arial,sans-serif" font-size="15"
     font-weight="bold" fill="#1e3a8a" text-anchor="middle">
    <text x="320" y="309">95</text>
    <text x="320" y="332">88</text>
    <text x="320" y="355">92</text>
    <text x="320" y="378">96</text>
  </g>

  <!-- A+ Grade -->
  <text x="145" y="420" font-family="Arial,sans-serif"
        font-size="47" font-weight="bold" font-style="italic"
        fill="#dc2626">A+</text>

  <!-- Graduation cap -->
  <path d="M75 100 L210 45 L345 100 L210 155Z"
        fill="#0f172a"/>
  <path d="M125 120 L125 150 Q210 195 295 150 V120 L210 155Z"
        fill="#172554"/>
  <path d="M345 100 V145" stroke="#facc15" stroke-width="5"/>
  <circle cx="345" cy="148" r="7" fill="#facc15"/>

  <!-- Achievement medal -->
  <path d="M355 390 L375 455 L400 438 L420 455 L435 390"
        fill="#ef4444"/>
  <circle cx="395" cy="380" r="48" fill="url(#gold)"
          stroke="#fbbf24" stroke-width="5"/>
  <circle cx="395" cy="380" r="35" fill="none"
          stroke="#d97706" stroke-width="4"/>
  <path d="M395 355 L403 373 L423 375 L408 389
           L412 410 L395 399 L378 410 L382 389
           L367 375 L387 373Z"
        fill="#92400e"/>
</svg>
